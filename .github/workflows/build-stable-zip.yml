name: Build Stable Discord Bot ZIP

on:
  push:
    branches:
      - "stable-discord-bot-20261001"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python3 -m py_compile bot.py storage.py cogs/*.py

      - name: Build ZIP
        run: |
          rm -rf .git __pycache__ cogs/__pycache__
          rm -f discord-bot-stable.zip
          zip -r discord-bot-stable.zip . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"
          test -s discord-bot-stable.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: discord-bot-stable
          path: discord-bot-stable.zip
          if-no-files-found: error
          retention-days: 7
