name: Public Lavalink Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_public_lavalink.py"
      - "cogs/music.py"
      - ".github/workflows/lavalink-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ytsearch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "aiohttp>=3.9"
      - name: Query public Lavalink nodes
        run: python scripts/check_public_lavalink.py
