name: AI Persona Tests

on:
  push:
    branches:
      - main
      - fix/stable-ai-personality
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  persona-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run persona unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q bot.py cogs tests
